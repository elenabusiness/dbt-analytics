name: dbt Scheduled Run

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6am UTC
  workflow_dispatch: {}   # Allow manual trigger

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-snowflake==1.12.5

      - name: Set up dbt profile and key
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml ~/.dbt/profiles.yml
          echo "$SNOWFLAKE_PRIVATE_KEY" > "$HOME/.dbt/snowflake_key.pem"
          chmod 600 "$HOME/.dbt/snowflake_key.pem"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$HOME/.dbt/snowflake_key.pem" >> "$GITHUB_ENV"

      - name: Install packages
        run: dbt deps

      - name: dbt build (prod)
        run: dbt build --target prod

      - name: Clean up secrets
        if: always()
        run: rm -f ~/.dbt/snowflake_key.pem ~/.dbt/profiles.yml
