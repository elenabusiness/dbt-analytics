name: dbt PR Check

on:
  pull_request:
    branches: [main]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_PRIVATE_KEY_PATH: ~/.dbt/snowflake_key.pem
  DBT_SCHEMA: dbt_ci_pr_${{ github.event.pull_request.number }}

jobs:
  dbt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Write private key file
        run: |
          mkdir -p ~/.dbt
          echo "$SNOWFLAKE_PRIVATE_KEY" > ~/.dbt/snowflake_key.pem
          chmod 600 ~/.dbt/snowflake_key.pem

      - name: Install packages
        run: dbt deps --profiles-dir .

      - name: dbt build
        run: dbt build --target dev --profiles-dir .

      - name: Clean up key
        if: always()
        run: rm -f ~/.dbt/snowflake_key.pem
