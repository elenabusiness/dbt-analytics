name: dbt Production Deploy

on:
  push:
    branches: [main]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_PRIVATE_KEY_PATH: ~/.dbt/snowflake_key.pem

jobs:
  dbt-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-snowflake==1.12.5

      - name: Set up dbt profile and key
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml ~/.dbt/profiles.yml
          echo "$SNOWFLAKE_PRIVATE_KEY" > ~/.dbt/snowflake_key.pem
          chmod 600 ~/.dbt/snowflake_key.pem

      - name: Install packages
        run: dbt deps

      - name: dbt build (prod)
        run: dbt build --target prod

      - name: Clean up secrets
        if: always()
        run: rm -f ~/.dbt/snowflake_key.pem ~/.dbt/profiles.yml
