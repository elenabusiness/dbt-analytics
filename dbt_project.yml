name: lab
version: "1.0.0"
profile: lab
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
clean-targets: ["target", "dbt_packages"]

models:
  dbt_project_evaluator:
    +enabled: "{{ env_var('DBT_CLOUD_PR_ID', '') == '' }}"
  lab:
    shopify_dataform_migration:
      +schema: shopify_dataform_migration
      tableau_datasources:
        +schema: tableau_datasources
      viz_test_attribution_tool:
        +schema: tableau_datasources

snapshots:
  lab:
    +schema: snapshots          # dbt >= 1.9: schema (not target_schema), so it follows generate_schema_name

seeds:
  lab:
    +schema: seeds

vars:
  # the business's "today" for the practice data; models use it instead of current_date so answers are stable
  as_of_date: "2026-10-31"
